<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TaskBloom | Modern To-Do Manager</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="app-container">

        <div class="todo-card">

            <!-- Header -->

            <div class="header">

                <h1 class="heading">
                    🌸 TaskBloom
                </h1>

                <p class="subtitle">
                    Organize your day beautifully.
                </p>

                <button id="themeBtn" class="theme-btn">
                    🌙 Dark Mode
                </button>

            </div>

            <!-- Search -->

            <div class="search-section">

                <input type="text" id="searchInput" class="search-input" placeholder="Search tasks...">

            </div>

            <!-- Add Task -->

            <div class="input-section">

                <input type="text" id="taskInput" class="task-input" placeholder="Enter a task">

                <select id="prioritySelect" class="priority-select">

                    <option value="High">
                        🔴 High
                    </option>

                    <option value="Medium" selected>
                        🟡 Medium
                    </option>

                    <option value="Low">
                        🟢 Low
                    </option>

                </select>

                <input type="date" id="dateInput" class="date-input">

                <button id="addBtn" class="add-btn">

                    ➕ Add

                </button>

            </div>

            <!-- Filter -->

            <div class="filter-section">

                <button class="filter-btn active">
                    All
                </button>

                <button class="filter-btn">
                    Active
                </button>

                <button class="filter-btn">
                    Completed
                </button>

            </div>

            <!-- Sort -->

            <div class="sort-section">

                <label>

                    Sort By

                </label>

                <select id="sortSelect">

                    <option value="newest">
                        Newest First
                    </option>

                    <option value="oldest">
                        Oldest First
                    </option>

                    <option value="priority">
                        Priority
                    </option>

                    <option value="date">
                        Due Date
                    </option>

                </select>

            </div>

            <!-- Progress -->

            <div class="progress-container">

                <div class="progress-top">

                    <span id="progressText">

                        0% Completed

                    </span>

                    <span id="remainingTasks">

                        0 Remaining

                    </span>

                </div>

                <div class="progress-bar">

                    <div id="progressFill" class="progress-fill">

                    </div>

                </div>

            </div>

            <!-- Statistics -->

            <div class="stats">

                <div class="stat-card">

                    <h2 id="totalTasks">
                        0
                    </h2>

                    <p>Total</p>

                </div>

                <div class="stat-card">

                    <h2 id="completedTasks">
                        0
                    </h2>

                    <p>Completed</p>

                </div>

                <div class="stat-card">

                    <h2 id="pendingTasks">
                        0
                    </h2>

                    <p>Pending</p>

                </div>

            </div>
            <!-- Task List -->

            <div id="taskList" class="task-list">

                <div id="emptyState" class="empty-state">

                    <div class="empty-icon">
                        📝
                    </div>

                    <h3>
                        No Tasks Yet
                    </h3>

                    <p>
                        Start by adding your first task.
                    </p>

                </div>

            </div>

            <!-- Footer -->

            <div class="footer">

                <p id="taskCount">
                    Total: 0 | Completed: 0
                </p>

            </div>

        </div>

    </div>

    <!-- Edit Modal -->

    <div id="editModal" class="modal">

        <div class="modal-content">

            <h2>
                ✏️ Edit Task
            </h2>

            <input type="text" id="editInput" placeholder="Update your task">

            <div class="modal-buttons">

                <button id="saveEditBtn">
                    Save
                </button>

                <button id="cancelEditBtn">
                    Cancel
                </button>

            </div>

        </div>

    </div>

    <!-- Delete Confirmation Modal -->

    <div id="deleteModal" class="modal">

        <div class="modal-content">

            <h2>
                🗑️ Delete Task
            </h2>

            <p>
                Are you sure you want to delete this task?
            </p>

            <div class="modal-buttons">

                <button id="confirmDeleteBtn">
                    Delete
                </button>

                <button id="cancelDeleteBtn">
                    Cancel
                </button>

            </div>

        </div>

    </div>

    <!-- Toast -->

    <div id="toast" class="toast">

        Task Added Successfully!

    </div>

    <!-- Confetti -->

    <div id="confettiContainer"></div>

    <script src="script.js" defer></script>

</body>

</html>
